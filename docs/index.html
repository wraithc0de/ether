<!DOCTYPE html>
<html>
    <head>
        <title>UI Documentation</title>

        <link rel="stylesheet" href="../packages/icons/dist/css/ether-icons.css">
        <link rel="stylesheet" href="../packages/ui/dist/styles/index.css">
        <script type="importmap">
            {
                "imports": {
                    "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/+esm"
                }
            }
        </script>
        <script type="module" src="../packages/ui/dist/index.js"></script>

        <style>
            body {font-family: sans-serif;}
        </style>
    </head>
    <body>
        <eu-nav type="top">
            <eu-logo src="">Ether</eu-logo>
            <eu-spacer></eu-spacer>
            <eu-segmented-control default="2" type="compact">
                <button><eu-icon>sun</eu-icon></button>
                <button><eu-icon>gear</eu-icon></button>
                <button><eu-icon>moon</eu-icon></button>
            </eu-segmented-control>
            <eu-button type="subtle">Icons</eu-button>
            <eu-button type="subtle">Docs</eu-button>
            <eu-divider orientation="vertical" size="90"></eu-divider>
            <eu-button type="subtle"><eu-icon>github</eu-icon></eu-button>
            <eu-dropdown type="button-primary">
                <span slot="label">Download</span>
                <eu-dropdown-content slot="content">
                    <eu-button type="flush"><eu-icon>layout</eu-icon> UI</eu-button>
                    <eu-button type="flush"><eu-icon>check</eu-icon> Icons</eu-button>
                    <eu-button type="ghost">Link via CDN</eu-button>
                </eu-dropdown-content>
            </eu-dropdown>
        </eu-nav>
        <eu-layout orientation="horizontal" sections="static-fill-static">
            <eu-tree pages="#doc-content" active="ui-introduction">
                <span slot="label"><eu-icon>ui-tree</eu-icon> Navigation</span>
                <eu-tree-section name="ui">
                    <span slot="label">Ether UI</span>
                    <eu-tree-item topage="introduction" active>Introduction</eu-tree-item>
                    <eu-tree-folder name="gettingStarted" open>
                        <span slot="label">Getting Started</span>
                        <eu-tree-item topage="ui-installation">Installation</eu-tree-item>
                        <eu-tree-item topage="ui-download">Download</eu-tree-item>
                        <eu-tree-item topage="ui-customize">Customize</eu-tree-item>
                    </eu-tree-folder>
                </eu-tree-section>
            </eu-tree>
            <eu-pages id="doc-content" default="introduction" active="introduction">
                <section name="ui-introduction">
                    <!-- Page content -->
                </section>
                <section name="ui-gettingStarted-installation">
                    <!-- Page content -->
                </section>
                <section name="ui-gettingStarted-download">
                    <!-- Page content -->
                </section>
                <section name="ui-gettingStarted-customize">
                    <!-- Page content -->
                </section>
            </eu-pages>
            <eu-toc source="#doc-content">
                <!-- Table of contents -->
            </eu-toc>
        </eu-layout>
    </body>
</html>
