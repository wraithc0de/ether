<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ether-icons</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 10px 20px;
      text-align: center;
    }
    .preview {
      width: 100px;
      display: inline-block;
      margin: 10px;
    }
    .preview .inner {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: #f5f5f5;
      -webkit-border-radius: 3px 3px 0 0;
      -moz-border-radius: 3px 3px 0 0;
      border-radius: 3px 3px 0 0;
    }
    .preview .inner  {
      line-height: 85px;
      font-size: 40px;
      color: #333;
    }
    .label {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 5px;
      font-size: 10px;
      font-family: Monaco, monospace;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: #ddd;
      -webkit-border-radius: 0 0 3px 3px;
      -moz-border-radius: 0 0 3px 3px;
      border-radius: 0 0 3px 3px;
      color: #666;
    }
  </style>

  <link rel="stylesheet" href="../css/ether-icons.css">
</head>
<body>
  <h1>ether-icons</h1>

  <div class="preview">
    <span class="inner">
      <i class="ei ei-check"></i>
    </span>
    <br>
    <span class="label">check</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-download"></i>
    </span>
    <br>
    <span class="label">download</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-export"></i>
    </span>
    <br>
    <span class="label">export</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-gear"></i>
    </span>
    <br>
    <span class="label">gear</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-layout"></i>
    </span>
    <br>
    <span class="label">layout</span>
  </div>
  <div class="preview">
    <span class="inner">

    </span>
    <br>
    <span class="label">link</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-list-bullet"></i>
    </span>
    <br>
    <span class="label">list-bullet</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-menu-hamburger"></i>
    </span>
    <br>
    <span class="label">menu-hamburger</span>
  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-menu-meatball"></i>
    </span>

  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-moon-stars"></i>
    </span>

  </div>
  <div class="preview">
    <span class="inner">
      <i class="ei ei-moon"></i>
    </span>
    <br>
    <span class="label">moon</span>
  </div>
  <div class="preview">

      <i class="ei ei-sun"></i>

  <div class="preview">

    </span>
    <br>
    <span class="label">ui-tree</span>
  </div>
</body>
</html>
